name: Wersja webowa (GitHub Pages)

# Każdy merge do master publikuje wersję webową aplikacji na GitHub Pages:
# https://wgfizban.github.io/CC_NEW/
# Jednorazowo trzeba włączyć: Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Jedno wdrożenie naraz; nowsze zastępuje oczekujące.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Wersja Fluttera jest przypięta w .github/flutter-version (jedno miejsce
      # dla wszystkich workflowów). Podbijaj ją świadomie, razem z Gradle/AGP.
      - id: flutter-version
        run: echo "version=$(tr -d '[:space:]' < .github/flutter-version)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter gen-l10n

      # Ścieżka bazowa musi odpowiadać nazwie repozytorium.
      # Wersja pokazywana w „Info o aplikacji": data budowy i skrót commita,
      # żeby przy zgłoszeniach dało się ustalić, jaką wersję ktoś widzi.
      - run: |
          flutter build web --release --base-href "/CC_NEW/" \
            --dart-define=APP_VERSION="web $(date -u +%Y-%m-%d) (${GITHUB_SHA::7})"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
