name: Wersja webowa (GitHub Pages)

# Każdy merge do master publikuje wersję webową aplikacji na GitHub Pages:
# https://wgfizban.github.io/CC_NEW/
# Jednorazowo trzeba włączyć: Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Jedno wdrożenie naraz; nowsze zastępuje oczekujące.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Wersja Fluttera jest przypięta w .github/flutter-version (jedno miejsce
      # dla wszystkich workflowów). Podbijaj ją świadomie, razem z Gradle/AGP.
      - id: flutter-version
        run: echo "version=$(tr -d '[:space:]' < .github/flutter-version)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter gen-l10n

      # Ścieżka bazowa musi odpowiadać nazwie repozytorium.
      # Numer wersji w „Info o aplikacji" ma być taki sam jak w wydaniu APK
      # (v1, v2, ...). Workflow „Release APK" liczy numer z tagów vN: jeśli
      # tag tego commita już istnieje, bierzemy go, a jeśli jeszcze nie
      # (oba workflowy ruszają równolegle), to będzie to kolejny numer.
      - name: Wylicz numer wersji
        run: |
          TAGS=$(git ls-remote --tags --refs origin 'refs/tags/v*')
          LAST=$(echo "$TAGS" | sed 's|.*refs/tags/v||' | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)
          AT_HEAD=$(echo "$TAGS" | awk -v sha="$GITHUB_SHA" '$1==sha {sub("refs/tags/v","",$2); print $2}' | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)
          echo "APP_VERSION=v${AT_HEAD:-$(( ${LAST:-0} + 1 ))}" >> "$GITHUB_ENV"
          echo "APP_DATE=$(TZ=Europe/Warsaw date +%Y-%m-%d)" >> "$GITHUB_ENV"

      # Ścieżka bazowa musi odpowiadać nazwie repozytorium.
      - run: flutter build web --release --base-href "/CC_NEW/" --dart-define=APP_VERSION="$APP_VERSION" --dart-define=APP_DATE="$APP_DATE"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
