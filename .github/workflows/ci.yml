name: Sprawdzenie PR

# Każdy pull request do master jest budowany i testowany, zanim trafi do
# master, więc błąd budowy (np. po zmianie wersji Fluttera/Gradle) widać
# w PR, a nie dopiero po scaleniu. Nic nie jest publikowane.
on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# Nowszy przebieg tej samej gałęzi zastępuje trwający.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - id: flutter-version
        run: echo "version=$(tr -d '[:space:]' < .github/flutter-version)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test

      # Wersja debug wystarcza, żeby sprawdzić konfigurację Gradle/AGP.
      - run: flutter build apk --debug
