name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag wydania, np. v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter test

      # Opcjonalny podpis własnym kluczem (sekrety w Settings -> Secrets and variables -> Actions).
      # Bez sekretów APK jest podpisany kluczem debugowym.
      - name: Przygotuj keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
          else
            echo "Brak keystore - podpis kluczem debugowym."
          fi

      - name: Zbuduj APK
        run: |
          set -o pipefail
          if ! flutter build apk --release 2>&1 | tee build.log; then
            # Skrót błędu jako adnotacja, widoczna na stronie przebiegu bez otwierania logów.
            MSG=$(grep -E -A6 'What went wrong|FAILURE|error:|Error:|Exception' build.log | head -n 40 | tr '\n' '|' | cut -c1-3500)
            echo "::error title=Build APK failed::$MSG"
            exit 1
          fi

      - name: Opublikuj wydanie
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk CarcassonneCounter.apk
          gh release create "$TAG" CarcassonneCounter.apk \
            --title "$TAG" --generate-notes --target "$GITHUB_SHA"
