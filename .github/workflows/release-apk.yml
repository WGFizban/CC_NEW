name: Release APK

# Każdy merge do master (czyli push na master) buduje APK i publikuje wydanie
# z kolejnym numerem wersji: v1, v2, v3 ... Numer jest liczony z istniejących
# tagów vN, więc nie trzeba go nigdzie ręcznie podbijać.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

# Wydania idą po kolei, żeby dwa przebiegi nie wzięły tego samego numeru.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Wylicz numer wersji
        run: |
          # Tylko tagi w postaci vN (starsze, jak v1.0.4, są pomijane).
          LAST=$(git ls-remote --tags --refs origin 'refs/tags/v*' \
            | sed 's|.*refs/tags/v||' | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)
          VERSION=$(( ${LAST:-0} + 1 ))
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "Wersja wydania: v$VERSION"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter gen-l10n

      - run: flutter test

      # Opcjonalny podpis własnym kluczem (sekrety w Settings -> Secrets and variables -> Actions).
      # Bez sekretów APK jest podpisany kluczem debugowym.
      - name: Przygotuj keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
          else
            echo "Brak keystore - podpis kluczem debugowym."
          fi

      - name: Zbuduj APK
        run: |
          set -o pipefail
          # Numer wersji (też jako kod wersji Androida) rośnie z każdym wydaniem.
          if ! flutter build apk --release --build-name="$VERSION" --build-number="$VERSION" 2>&1 | tee build.log; then
            # Skrót błędu jako adnotacja, widoczna na stronie przebiegu bez otwierania logów.
            MSG=$(grep -E -A6 'What went wrong|FAILURE|error:|Error:|Exception' build.log | head -n 40 | tr '\n' '|' | cut -c1-3500)
            echo "::error title=Build APK failed::$MSG"
            exit 1
          fi

      - name: Opublikuj wydanie
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk CarcassonneCounter.apk
          gh release create "$TAG" CarcassonneCounter.apk \
            --title "$TAG" --generate-notes --target "$GITHUB_SHA"
