name: cc_new
description: "Licznik punktów do gry planszowej Carcassonne."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_svg: ^2.0.10+1
  shared_preferences: ^2.3.3
  flutter_colorpicker: ^1.0.3
  wakelock_plus: ^1.2.8
  package_info_plus: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.10

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/meeple.svg
    - assets/icons/game/
    - assets/icons/splash_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#c8a96a"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

flutter_native_splash:
  color: "#000080"
  image: assets/icons/splash_logo_padded.png
  android: true
  ios: false
  web: false
  android_gravity: center
  android_12:
    color: "#000080"
    image: assets/icons/splash_logo_android12.png
